repositories {
    maven { url 'https://maven.fabric.io/public' }
    maven { url 'https://dl.bintray.com/mocaplatform/maven' }
}

buildscript {
    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }

    repositories {
        jcenter()
        maven { url 'http://dl.bintray.com/iaguila/maven' }
        maven { url 'https://maven.fabric.io/public' }
    }
}

apply plugin: 'com.android.application'
apply plugin: 'io.fabric'
apply plugin: 'realm-android'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 27
    buildToolsVersion '28.0.2'
    flavorDimensions "default"

    defaultConfig {
        applicationId "com.massiva.nuevopudahuel"
        minSdkVersion 16
        targetSdkVersion 27
        versionCode 124
        versionName "1.1.1"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "api_url", "https://pudahuel.gearlabs.cl/flightsApi/v1"
            resValue "string", "banners_api_url", "https://pudahuel.gearlabs.cl/bannersApi/v1"

            //resValue "string", "api_url", "http://54.233.145.28/flightsApi/v1"
            //resValue "string", "banners_api_url", "http://54.233.145.28/bannersApi/v1"

            resValue "string", "moca_app_key", "30fG6xGjSqKoHPlRADloKw"
            resValue "string", "moca_app_secret", "BD2Hdenm8emN/9VRIcKn8RNGKSs="
        }
        debug {

            resValue "string", "api_url", "https://pudahuel.gearlabs.cl/flightsApi/v1"
            resValue "string", "banners_api_url", "https://pudahuel.gearlabs.cl/bannersApi/v1"

            //resValue "string", "api_url", "http://54.233.145.28/flightsApi/v1"
            //resValue "string", "banners_api_url", "http://54.233.145.28/bannersApi/v1"

//            MOCA PRO
            resValue "string", "moca_app_key", "30fG6xGjSqKoHPlRADloKw"
            resValue "string", "moca_app_secret", "BD2Hdenm8emN/9VRIcKn8RNGKSs="

//            MOCA TEST
//            resValue "string", "moca_app_key", "KQNtJe6-SO-vRGdg3zAYgQ"
//            resValue "string", "moca_app_secret", "3G31ZMiYxuQLXZLZoQjUcWkN88U="
        }
    }
    signingConfigs {
        release {
            storeFile file('NuevoPudahuelKeystore.jks')
            storePassword 'pass4android'
            keyAlias 'nuevopudahuel'
            keyPassword 'pass4android'
        }
        debug {
            storeFile file('NuevoPudahuelKeystore.jks')
            storePassword 'pass4android'
            keyAlias 'nuevopudahuel'
            keyPassword 'pass4android'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    //PARA DESCARGA DE ZIPS, USADO EN MAPAS 2D ETC
    useLibrary 'org.apache.http.legacy'
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    testCompile 'junit:junit:4.12'
    compile 'com.android.support:multidex:1.0.2'

    //UI
    compile 'com.android.support:appcompat-v7:27.0.2'
    compile 'com.android.support:support-v4:27.0.2'
    compile 'com.android.support:recyclerview-v7:27.0.2'
    compile 'com.android.support:design:27.0.2'
    compile 'uk.co.chrisjenx:calligraphy:2.1.0'

    //GOOGLE PLAY SERVICES
    compile 'com.google.android.gms:play-services-ads:12.0.1'
    compile 'com.google.android.gms:play-services-vision:12.0.1'
    compile 'com.google.android.gms:play-services-gcm:12.0.1'
    compile 'com.google.android.gms:play-services-location:12.0.1'


    //FIREBASE
    implementation 'com.google.firebase:firebase-core:12.0.1'
    implementation 'com.google.firebase:firebase-messaging:12.0.1'

    //Utils
    compile 'com.nostra13.universalimageloader:universal-image-loader:1.9.4'
    compile 'net.moddity.bzutils.android:BZUtils-Android-Gradle:1.0.3@aar'

    //RETROFIT
    compile 'com.squareup.retrofit:retrofit:1.9.0'
    compile 'com.squareup.okhttp:okhttp:2.2.0'
    compile 'com.google.code.gson:gson:2.8.0'

    //FACEBOOK
    compile 'com.facebook.android:facebook-android-sdk:4.29.0'

    //MOCA
    compile('com.mocaplatform:moca-android-sdk:2.5.6') {
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.google.android.gms', module: 'play-services-gcm'
        exclude group: 'com.google.android.gms', module: 'play-services-location'
        exclude group: 'org.msgpack', module: 'msgpack'

    }

    //TRACKING
    compile 'com.flurry.android:analytics:6.2.0'
    compile('com.crashlytics.sdk.android:crashlytics:2.6.7@aar') {
        transitive = true;
    }
    compile('com.crashlytics.sdk.android:answers:1.3.8@aar') {
        transitive = true;
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

apply plugin: 'com.google.gms.google-services'
