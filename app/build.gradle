apply plugin: 'com.android.application'
apply plugin: 'io.fabric'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'realm-android'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}

buildscript {
    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }

    repositories {
        jcenter()
        maven { url 'http://dl.bintray.com/iaguila/maven' }
        maven { url 'https://maven.fabric.io/public' }
    }
}

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.2"

    defaultConfig {
        applicationId "com.massiva.nuevopudahuel"
        minSdkVersion 16
        targetSdkVersion 23
        versionCode 104
        versionName "1.0"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "api_url", "http://54.233.145.28/flightsApi/v1"
            resValue "string", "banners_api_url", "http://54.233.145.28/bannersApi/v1"

            resValue "string", "moca_app_key", "30fG6xGjSqKoHPlRADloKw"
            resValue "string", "moca_app_secret", "BD2Hdenm8emN/9VRIcKn8RNGKSs="
        }
        debug {
            resValue "string", "api_url", "http://54.233.145.28/flightsApi/v1"
            resValue "string", "banners_api_url", "http://54.233.145.28/bannersApi/v1"

//            MOCA PRO
            resValue "string", "moca_app_key", "30fG6xGjSqKoHPlRADloKw"
            resValue "string", "moca_app_secret", "BD2Hdenm8emN/9VRIcKn8RNGKSs="

//            MOCA TEST
//            resValue "string", "moca_app_key", "KQNtJe6-SO-vRGdg3zAYgQ"
//            resValue "string", "moca_app_secret", "3G31ZMiYxuQLXZLZoQjUcWkN88U="
        }
    }
    signingConfigs {
        release {
            storeFile file('NuevoPudahuelKeystore.jks')
            storePassword 'pass4android'
            keyAlias 'nuevopudahuel'
            keyPassword 'pass4android'
        }
        debug {
            storeFile file('NuevoPudahuelKeystore.jks')
            storePassword 'pass4android'
            keyAlias 'nuevopudahuel'
            keyPassword 'pass4android'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    testCompile 'junit:junit:4.12'
    compile 'com.android.support:multidex:1.0.1'

    //UI
    compile 'com.android.support:appcompat-v7:24.0.0-alpha1'
    compile 'com.android.support:support-v4:24.0.0-alpha1'
    compile 'com.android.support:recyclerview-v7:24.0.0-alpha1'
    compile 'com.android.support:design:24.0.0-alpha1'
    compile 'uk.co.chrisjenx:calligraphy:2.1.0'

    //GOOGLE PLAY SERVICES
    compile 'com.google.android.gms:play-services-ads:8.3.0'
    compile 'com.google.android.gms:play-services-vision:8.3.0'
    compile 'com.google.android.gms:play-services-gcm:8.3.0'
    compile 'com.google.android.gms:play-services-location:8.3.0'

    //Utils
    compile 'com.nostra13.universalimageloader:universal-image-loader:1.9.3'
    compile 'net.moddity.bzutils.android:BZUtils-Android-Gradle:1.0.3@aar'

    //RETROFIT
    compile 'com.squareup.retrofit:retrofit:1.9.0'
    compile 'com.squareup.okhttp:okhttp:2.2.0'
    compile 'com.google.code.gson:gson:2.4'

    //FACEBOOK
    compile 'com.facebook.android:facebook-android-sdk:4.+'

    //MOCA
    compile project(':moca-sdk-android-1.8.11')

    //TRACKING
    compile 'com.flurry.android:analytics:6.2.0'
    compile('com.crashlytics.sdk.android:crashlytics:2.5.5@aar') {
        transitive = true;
    }
}
