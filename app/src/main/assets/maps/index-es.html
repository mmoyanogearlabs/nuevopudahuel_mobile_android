    <script type="text/javascript">
        function centerVerticallyButtons(){
            var $vdUiButtonsComponent = $('.vdUiButtons');
            var boxTop = ($(window).height()) / 2 - ($vdUiButtonsComponent.height() / 2);
            var stringBoxTop = boxTop+"px !important";
            alert("pixels centrado "+stringBoxTop);
            $('.vdUiButtons').css({"top": stringBoxTop});
        }
    </script>
    <script type="text/javascript">

        /**
         * Preseleccionamos la planta 3 en lugar de la 0 por defecto, y zoom 4 presiones (0.5 defecto)
         */
        (function($, global) {
            $(document).ready(function(ev) {
                var path = window.location.pathname.split("/");
                path = path.splice(0, path.length - 1).join("/");
                var params = {
                    loader: {
                        hostName: "",
                        protocol: "file",
                        path: path + "/MapData"
                    },
                    colorsMap: {
                        selected: "orange",
                        over: "orange",
                        titleSelected: "gray",
                        titleOver: "yellow"
                    },
                    model: VDModel,
                    scaleMode: "fitInView",
                    zoomLevel: 2.0,
                    selectedDestination: 6,
                    selectedFloor: "3",
                    displayItineraries: true,
                    userInterface: new OfflineViewerUi(),
                    userInterfaceParams: {
                        openUiOnSelectedDestination: false,
                        showItineraries: true
                    },
                              
                };

                jQuery(".vd-viewer").vdCanvasViewer(params);
                // Hago pruebas aquí para simular pulsado 4 veces
                // Obtención elemento
                // $('.vdMapButton[data-action=vdUIZoomIn]').css({"background-color":"red"});

                $('.vdUiButtons').css({"height":"350px", "margin-top":"100px"}); //Prueba no valida.

            });
        })(jQuery, window);
